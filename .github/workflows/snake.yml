name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=3fb950&color_dots=#ffb3b3,#ff6b6b,#ff3333,#cc0000,#8b0000
            dist/github-snake-dark.svg?color_snake=3fb950&color_dots=#ffb3b3,#ff6b6b,#ff3333,#cc0000,#8b0000&color_background=#0d1117

      - name: Push output to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true